[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-nlg-metrics"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]

basic = [
    "sacrebleu",
    "rouge-score",
    "nltk",
]

bertscore = [
    "torch",
    "transformers",
    "bert-score",
]

bartscore = [
    "torch",
    "transformers",
    "string2string",
]

menli = [
    "torch",
    "transformers",
]

bleurt = [
    "BLEURT @ git+https://github.com/google-research/bleurt.git@master",
]
# "BLEURT @ git+https://github.com/google-research/bleurt.git@cebe7e6"

comet = [
    "transformers>=4.17,<5",
    "sentencepiece>=0.2",
    "pandas>=1.4.1",
    "pytorch-lightning>=2.0",
    "jsonargparse==3.13.1",
    "sacrebleu>=2.0",
    "scipy>=1.5.4",
    "entmax>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]